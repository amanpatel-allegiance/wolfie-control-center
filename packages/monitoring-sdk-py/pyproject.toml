[project]
name = "wolfie-monitoring-sdk"
version = "0.1.0"
description = "Ask Wolfie Control Center — pipeline instrumentation SDK (Python)"
requires-python = ">=3.10"
dependencies = [
  "supabase>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wolfie_monitoring"]
